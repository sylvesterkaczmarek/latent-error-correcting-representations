[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-error-correcting-representations"
version = "0.2.0"
description = "Controlled experiments on error-correcting redundancy for latent self-monitoring and repair."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<8"]

[project.urls]
Homepage = "https://www.sylvesterkaczmarek.com"
Repository = "https://github.com/sylvesterkaczmarek/latent-error-correcting-representations"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["latent_error_correcting_representations*", "experiments*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["F"]
